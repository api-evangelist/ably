naftiko: 1.0.0-alpha2
info:
  label: Control API v1 — apps
  description: 'Control API v1 — apps. 5 operations. Lead operation: Lists account apps. Self-contained Naftiko capability
    covering one Ably business surface.'
  tags:
  - Ably
  - apps
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ABLY_API_KEY: ABLY_API_KEY
capability:
  consumes:
  - type: http
    namespace: control-apps
    baseUri: https://control.ably.net/v1
    description: Control API v1 — apps business capability. Self-contained, no shared references.
    resources:
    - name: accounts-account_id-apps
      path: /accounts/{account_id}/apps
      operations:
      - name: get
        method: GET
        description: Lists account apps
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: account_id
          in: path
          type: string
          description: The account ID for which to retrieve the associated applications.
          required: true
      - name: post
        method: POST
        description: Creates an app
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: account_id
          in: path
          type: string
          description: The account ID of the account in which to create the application.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: apps-id
      path: /apps/{id}
      operations:
      - name: patch
        method: PATCH
        description: Updates an app
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The ID of application to be updated.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: delete
        method: DELETE
        description: Deletes an app
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The ID of the application to be deleted.
          required: true
    - name: apps-id-pkcs12
      path: /apps/{id}/pkcs12
      operations:
      - name: post
        method: POST
        description: Updates app's APNs info from a `.p12` file
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The application ID.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.ABLY_API_KEY}}'
  exposes:
  - type: rest
    namespace: control-apps-rest
    port: 8080
    description: REST adapter for Control API v1 — apps. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/accounts/{account-id}/apps
      name: accounts-account-id-apps
      description: REST surface for accounts-account_id-apps.
      operations:
      - method: GET
        name: get
        description: Lists account apps
        call: control-apps.get
        with:
          account_id: rest.account_id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: post
        description: Creates an app
        call: control-apps.post
        with:
          account_id: rest.account_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/apps/{id}
      name: apps-id
      description: REST surface for apps-id.
      operations:
      - method: PATCH
        name: patch
        description: Updates an app
        call: control-apps.patch
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete
        description: Deletes an app
        call: control-apps.delete
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/apps/{id}/pkcs12
      name: apps-id-pkcs12
      description: REST surface for apps-id-pkcs12.
      operations:
      - method: POST
        name: post
        description: Updates app's APNs info from a `.p12` file
        call: control-apps.post
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: control-apps-mcp
    port: 9090
    transport: http
    description: MCP adapter for Control API v1 — apps. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: lists-account-apps
      description: Lists account apps
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: control-apps.get
      with:
        account_id: tools.account_id
      outputParameters:
      - type: object
        mapping: $.
    - name: creates-app
      description: Creates an app
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: control-apps.post
      with:
        account_id: tools.account_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: updates-app
      description: Updates an app
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: control-apps.patch
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: deletes-app
      description: Deletes an app
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: control-apps.delete
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: updates-app-s-apns-info-p12
      description: Updates app's APNs info from a `.p12` file
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: control-apps.post
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
