naftiko: 1.0.0-alpha2
info:
  label: Platform API — Authentication
  description: 'Platform API — Authentication. 1 operations. Lead operation: Request an access token. Self-contained Naftiko
    capability covering one Ably business surface.'
  tags:
  - Ably
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ABLY_API_KEY: ABLY_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-authentication
    baseUri: https://rest.ably.io
    description: Platform API — Authentication business capability. Self-contained, no shared references.
    resources:
    - name: keys-keyName-requestToken
      path: /keys/{keyName}/requestToken
      operations:
      - name: requestaccesstoken
        method: POST
        description: Request an access token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.ABLY_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-authentication-rest
    port: 8080
    description: REST adapter for Platform API — Authentication. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/keys/{keyname}/requesttoken
      name: keys-keyname-requesttoken
      description: REST surface for keys-keyName-requestToken.
      operations:
      - method: POST
        name: requestaccesstoken
        description: Request an access token
        call: platform-authentication.requestaccesstoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Platform API — Authentication. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: request-access-token
      description: Request an access token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-authentication.requestaccesstoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
