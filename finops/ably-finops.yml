specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Ably
providerId: ably
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
  - Realtime
  - FinOps
  - FOCUS
description: >-
  FinOps view of Ably. Subscription plus usage-based billing. Cost lines are flat-fee plan tier,
  per-million messages, per-million connection / channel minutes, and any push-notification
  add-on. Volume discounts apply at higher commitment levels.
sources:
  - https://ably.com/pricing
  - https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Ably Realtime
serviceCategory: Realtime Infrastructure
billingModel:
  pricingCategory: Subscription + Usage
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Subscription
    - Usage
    - Adjustment
focusColumns:
  ServiceName: Ably Platform API
  ServiceCategory: Realtime Infrastructure
  ProviderName: Ably
  PublisherName: Ably Realtime
  InvoiceIssuerName: Ably
  BillingCurrency: USD
  ChargeCategory: Subscription
meters:
  - name: subscription
    description: Monthly plan-tier subscription.
    unit: month
    aggregation: sum
    dimensions:
      - account
  - name: messages
    description: Messages above included allowance, $2.50 per million.
    unit: million_messages
    aggregation: sum
    dimensions:
      - account
      - app
  - name: connection_minutes
    description: Connection or channel minutes above allowance, $1.00 per million.
    unit: million_minutes
    aggregation: sum
    dimensions:
      - account
      - app
principles:
  - name: Visibility
    description: Pull Ably stats by app and namespace daily into FinOps store.
  - name: Allocation
    description: Allocate by app or namespace, mapping to consuming product or feature.
  - name: Optimization
    description: Use channel rewinds; batch publishes; close idle connections to reduce minute usage.
  - name: Accountability
    description: Assign a billing owner per account; review monthly.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
