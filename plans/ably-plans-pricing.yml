specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Ably
providerId: ably
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
  - Realtime
  - Plans
description: >-
  Ably publishes Free, Standard ($29/mo + usage), Pro ($399/mo + usage), and custom Enterprise
  tiers. All tiers include flat-fee allowances; usage above the included quotas is charged at
  $2.50 per million messages and $1.00 per million connection / channel minutes (with volume
  discounts down to $0.20 per million).
sources:
  - https://ably.com/pricing
plans:
  - id: ably-free
    name: Free
    type: freemium
    description: $0/month - 200 concurrent connections, 500 messages/sec, 1-day history.
    entries:
      - label: Monthly subscription
        name: free_monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Concurrent connections
        name: free_connections
        type: quota
        metric: concurrent_connections
        limit: 200
        timeFrame: continuous
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Message rate
        name: free_msg_rate
        type: quota
        metric: messages_per_second
        limit: 500
        timeFrame: second
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: 1-day message storage
      - name: Community support
  - id: ably-standard
    name: Standard
    type: subscription
    description: $29/month + usage - 10K connections, 2.5K msg/sec, 30-day history.
    entries:
      - label: Monthly subscription
        name: standard_monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '29.00'
        userMultiplied: false
      - label: Concurrent connections
        name: standard_connections
        type: quota
        metric: concurrent_connections
        limit: 10000
        timeFrame: continuous
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: 30-day history
      - name: 1-day email support SLA
  - id: ably-pro
    name: Pro
    type: subscription
    description: $399/month + usage - 50K connections, 10K msg/sec, 365-day history, Datadog integration.
    entries:
      - label: Monthly subscription
        name: pro_monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '399.00'
        userMultiplied: false
      - label: Concurrent connections
        name: pro_connections
        type: quota
        metric: concurrent_connections
        limit: 50000
        timeFrame: continuous
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: 365-day history
      - name: 4-hour email support SLA
      - name: Datadog integration
  - id: ably-enterprise
    name: Enterprise
    type: enterprise
    description: Custom pricing - unlimited concurrent channels, 99.999% SLA, HIPAA / SOC II compliance.
    entries:
      - label: Custom pricing
        name: enterprise_custom
        type: subscription
        metric: contract
        limit: -1
        timeFrame: contract
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: 99.999% uptime SLA
      - name: 24/7 support
      - name: HIPAA, SOC II
  - id: ably-usage
    name: Usage Pricing
    type: usage
    description: Overage / on-demand usage - $2.50 per million messages, $1.00 per million connection minutes.
    entries:
      - label: Messages
        name: msg_usage
        type: usage
        metric: million_messages
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '2.50'
        userMultiplied: false
      - label: Connection / channel minutes
        name: minute_usage
        type: usage
        metric: million_minutes
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '1.00'
        userMultiplied: false
    elements:
      - name: Volume discounts to $0.20 per million minutes
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
