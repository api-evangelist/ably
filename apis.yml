description: Ably is a realtime messaging platform offering pub/sub, presence, push
  notifications, chat, LiveSync, and integrations over WebSocket and HTTP. Ably publishes
  its OpenAPI specifications publicly via the ably/open-specs GitHub repository, with
  separate specs for the Platform API (REST messaging surface) and the Control API
  (account, app, and key management).
