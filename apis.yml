    url: capabilities/control-keys.yaml
  - type: NaftikoCapability
    url: capabilities/control-namespaces.yaml
  - type: NaftikoCapability
    url: capabilities/control-queues.yaml
  - type: NaftikoCapability
    url: capabilities/control-rules.yaml
  - type: NaftikoCapability
    url: capabilities/control-tokens.yaml
  x-features:
  - Manage apps and keys
  - Provision namespaces and integration rules
  - Webhook management
  - Account stats
  x-use-cases:
  - DevOps automation
  - Multi-tenant Ably provisioning
  - CI/CD environment setup
