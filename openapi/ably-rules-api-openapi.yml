              nullable: true
            authentication:
              type: object
              description: Pulsar supports authenticating clients using security tokens that are based on JSON Web Tokens.
              oneOf:
              - $ref: '#/components/schemas/pulsar_token_auth'
              discriminator:
                propertyName: authenticationMode
                mapping:
